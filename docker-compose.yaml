services:
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://kafka:29092,PLAINTEXT_EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:29092,PLAINTEXT_EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: betlandia
      POSTGRES_USER: betlandia
      POSTGRES_PASSWORD: betlandia
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betlandia"]
      interval: 10s
      timeout: 5s
      retries: 5

  cassandra:
    image: cassandra:4.1
    ports: ["9042:9042"]

  football-api-mock:
    build: ./cores/football_api_mock
    ports: ["3001:3001"]

  match-ingestor:
    build: ./cores/match_ingestor
    ports: ["8081:8081"]
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      football-api-mock:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: simulate
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      DB_URL: jdbc:postgresql://postgres:5432/betlandia
      DB_USERNAME: betlandia
      DB_PASSWORD: betlandia
      INTERNAL_API_URL: http://football-api-mock:3001/v4
      EXTERNAL_API_KEY: not-required

  odds-calculator:
    build: ./cores/odds_calculator
    ports: ["8082:8082"]
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      DB_URL: jdbc:postgresql://postgres:5432/betlandia
      DB_USERNAME: betlandia
      DB_PASSWORD: betlandia

  bet-service:
    build: ./cores/bet-service
    ports: ["8083:8083"]
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      DB_URL: jdbc:postgresql://postgres:5432/betlandia
      DB_USERNAME: betlandia
      DB_PASSWORD: betlandia

  api-gateway:
    build: ./cores/api_gateway
    ports: ["8080:8080"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      BET_SERVICE_URL: http://bet-service:8083
      ODDS_CALCULATOR_URL: http://odds-calculator:8082
      MATCH_INGESTOR_URL: http://match-ingestor:8081

  betlandia-web:
    build: ./cores/betlandia-web
    ports: ["3000:3000"]
    depends_on:
      - api-gateway
    environment:
      API_GATEWAY_URL: http://api-gateway:8080
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: http://localhost:8080
